<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Chatbot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────── */
    .sidebar {
      width: 300px;
      min-width: 300px;
      background: #141414;
      border-right: 1px solid #242424;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 24px;
      overflow-y: auto;
    }

    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .logo {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo span { color: #7c5cfc; }

    .section { display: flex; flex-direction: column; gap: 8px; }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #555;
    }

    /* Store status pill */
    .store-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #1c1c1c;
      border: 1px solid #272727;
      border-radius: 9px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3a3a3a;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .dot.on { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.4); }

    .store-id {
      font-size: 12px;
      color: #888;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 9px 14px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover:not(:disabled) { opacity: 0.82; }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary { background: #7c5cfc; color: #fff; }
    .btn-danger  { background: #991b1b; color: #fca5a5; border: 1px solid #7f1d1d; }
    .btn-ghost   { background: #222; color: #bbb; border: 1px solid #2e2e2e; }

    /* Upload area */
    .drop-zone {
      border: 2px dashed #2e2e2e;
      border-radius: 10px;
      padding: 22px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.over {
      border-color: #7c5cfc;
      background: rgba(124,92,252,0.04);
    }
    .drop-zone input { display: none; }
    .drop-icon { font-size: 26px; margin-bottom: 6px; }
    .drop-zone p { font-size: 12px; color: #666; line-height: 1.5; }
    .drop-zone p b { color: #7c5cfc; font-weight: 500; }

    /* Progress bar */
    .progress-wrap {
      height: 3px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #7c5cfc, #a78bfa);
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* File list */
    .files-list { display: flex; flex-direction: column; gap: 5px; }

    .file-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #1c1c1c;
      border: 1px solid #272727;
      border-radius: 8px;
      transition: border-color 0.15s;
    }
    .file-row:hover { border-color: #333; }

    .file-icon { font-size: 15px; flex-shrink: 0; }

    .file-name {
      font-size: 12px;
      color: #ccc;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-badge {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 5px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .badge-active  { background: #14532d; color: #86efac; }
    .badge-pending { background: #451a03; color: #fcd34d; }
    .badge-failed  { background: #450a0a; color: #fca5a5; }

    .del-btn {
      background: none;
      border: none;
      color: #444;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 1px 3px;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .del-btn:hover { color: #ef4444; }

    .files-empty {
      font-size: 12px;
      color: #484848;
      text-align: center;
      padding: 14px 0;
    }

    /* Refresh header row */
    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .tiny-btn {
      background: none;
      border: 1px solid #2e2e2e;
      color: #666;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 5px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .tiny-btn:hover { color: #bbb; border-color: #444; }

    /* ── Chat area ────────────────────────────── */
    .chat-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0d0d0d;
    }

    .chat-header {
      padding: 14px 22px;
      border-bottom: 1px solid #1e1e1e;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header h2 { font-size: 15px; font-weight: 600; color: #f0f0f0; }
    .chat-header p  { font-size: 12px; color: #555; margin-top: 2px; }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #252525; border-radius: 2px; }

    .msg-row { display: flex; gap: 10px; max-width: 78%; }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.bot  { align-self: flex-start; }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg-row.user .avatar { background: #7c5cfc; }
    .msg-row.bot  .avatar { background: #1e1e1e; border: 1px solid #303030; }

    .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.65;
    }
    .msg-row.user .bubble {
      background: #7c5cfc;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg-row.bot .bubble {
      background: #181818;
      color: #ddd;
      border: 1px solid #262626;
      border-bottom-left-radius: 4px;
    }
    .bubble pre {
      background: #111;
      padding: 8px 12px;
      border-radius: 7px;
      margin: 8px 0;
      overflow-x: auto;
      font-size: 12px;
      border: 1px solid #252525;
    }
    .bubble code {
      background: #111;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
    }

    /* Typing dots */
    .typing { display: flex; gap: 5px; align-items: center; padding: 4px 2px; }
    .typing span {
      width: 6px; height: 6px;
      background: #555;
      border-radius: 50%;
      animation: bounce 1.1s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.18s; }
    .typing span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* Welcome */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #444;
      text-align: center;
      padding: 40px;
    }
    .welcome-icon { font-size: 44px; }
    .welcome h3   { font-size: 17px; color: #555; font-weight: 500; }
    .welcome p    { font-size: 13px; color: #3a3a3a; max-width: 280px; line-height: 1.6; }

    /* Input bar */
    .input-bar {
      padding: 14px 20px;
      border-top: 1px solid #1e1e1e;
      background: #111;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-bar textarea {
      flex: 1;
      background: #181818;
      border: 1px solid #272727;
      border-radius: 10px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 13.5px;
      padding: 10px 14px;
      resize: none;
      outline: none;
      min-height: 42px;
      max-height: 120px;
      line-height: 1.5;
      transition: border-color 0.15s;
    }
    .input-bar textarea:focus  { border-color: #7c5cfc; }
    .input-bar textarea::placeholder { color: #444; }

    .send-btn {
      width: 42px;
      height: 42px;
      background: #7c5cfc;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
    }
    .send-btn:hover:not(:disabled) { opacity: 0.85; }
    .send-btn:active:not(:disabled) { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 22px;
      right: 22px;
      padding: 10px 16px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      z-index: 999;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: #14532d; color: #86efac; border: 1px solid #166534; }
    .toast.error   { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }
    .toast.info    { background: #1e1b4b; color: #c4b5fd; border: 1px solid #4338ca; }

    /* Spinner */
    .spin {
      width: 13px; height: 13px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ── Sidebar ─────────────────────────────────── -->
<aside class="sidebar">
  <div class="logo">&#129302; RAG <span>Chat</span></div>

  <!-- Knowledge store -->
  <div class="section">
    <div class="section-label">Knowledge Store</div>
    <div class="store-pill">
      <div class="dot" id="storeDot"></div>
      <span class="store-id" id="storeId">No store</span>
    </div>
    <button class="btn btn-primary" id="createBtn" onclick="createStore()">Create Store</button>
    <button class="btn btn-danger"  id="deleteBtn" style="display:none" onclick="confirmDeleteStore()">Delete Store</button>
  </div>

  <!-- Upload -->
  <div class="section" id="uploadSection" style="display:none">
    <div class="section-label">Upload Files</div>
    <div class="drop-zone" id="dropZone"
         onclick="document.getElementById('filePicker').click()"
         ondragover="onDragOver(event)"
         ondrop="onDrop(event)"
         ondragleave="onDragLeave()">
      <input type="file" id="filePicker" multiple
             accept=".pdf,.txt,.docx,.xlsx,.pptx,.md,.csv,.json,.html,.xml,.py,.js,.ts,.sql,.java,.go"
             onchange="onFileSelect(event)" />
      <div class="drop-icon">&#128196;</div>
      <p><b>Click to upload</b> or drag &amp; drop</p>
      <p>PDF, DOCX, TXT, XLSX, MD, CSV, JSON&hellip;</p>
    </div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <!-- File list -->
  <div class="section" id="filesSection" style="display:none">
    <div class="row-between">
      <span class="section-label">Files</span>
      <button class="tiny-btn" onclick="loadFiles()">&#8635; refresh</button>
    </div>
    <div class="files-list" id="filesList">
      <div class="files-empty">No files yet</div>
    </div>
  </div>
</aside>

<!-- ── Chat ─────────────────────────────────────── -->
<div class="chat-wrap">
  <div class="chat-header">
    <div>
      <h2>Document Q&amp;A</h2>
      <p id="chatSub">Create a store and upload files to get started</p>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">&#129302;</div>
      <h3>RAG Chatbot</h3>
      <p>Create a knowledge store, upload your documents, then ask anything.</p>
    </div>
  </div>

  <div class="input-bar">
    <textarea id="chatInput" placeholder="Ask a question about your documents…"
              rows="1"
              onkeydown="onKey(event)"
              oninput="autoGrow(this)"></textarea>
    <button class="send-btn" id="sendBtn" disabled onclick="sendMessage()">&#10148;</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  let history = [];
  let storeReady = false;

  // ── Init ──────────────────────────────────────
  window.onload = checkStore;

  // ── Toast ──────────────────────────────────────
  function toast(msg, type = 'info') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${type} show`;
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 3200);
  }

  // ── Store ──────────────────────────────────────
  async function checkStore() {
    try {
      const d = await api('GET', '/api/store');
      d.name ? activateStore(d) : deactivateStore();
    } catch { deactivateStore(); }
  }

  function activateStore(data) {
    storeReady = true;
    const short = data.name.split('/').pop().slice(0, 14);
    document.getElementById('storeDot').classList.add('on');
    document.getElementById('storeId').textContent = short + '…';
    document.getElementById('createBtn').style.display = 'none';
    document.getElementById('deleteBtn').style.display = 'block';
    document.getElementById('uploadSection').style.display = 'flex';
    document.getElementById('filesSection').style.display = 'flex';
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('chatSub').textContent = 'Ask questions about your uploaded documents';
    loadFiles();
  }

  function deactivateStore() {
    storeReady = false;
    document.getElementById('storeDot').classList.remove('on');
    document.getElementById('storeId').textContent = 'No store';
    document.getElementById('createBtn').style.display = 'block';
    document.getElementById('deleteBtn').style.display = 'none';
    document.getElementById('uploadSection').style.display = 'none';
    document.getElementById('filesSection').style.display = 'none';
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('chatSub').textContent = 'Create a store and upload files to get started';
  }

  async function createStore() {
    const btn = document.getElementById('createBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span>';
    try {
      const d = await api('POST', '/api/store');
      activateStore(d);
      toast('Store created!', 'success');
    } catch (e) {
      toast('Error: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create Store';
    }
  }

  function confirmDeleteStore() {
    if (!confirm('Delete the entire store and all files? This cannot be undone.')) return;
    deleteStore();
  }

  async function deleteStore() {
    try {
      await api('DELETE', '/api/store');
      deactivateStore();
      history = [];
      resetChat();
      toast('Store deleted', 'info');
    } catch (e) {
      toast('Error: ' + e.message, 'error');
    }
  }

  // ── Upload ─────────────────────────────────────
  function onDragOver(e) {
    e.preventDefault();
    document.getElementById('dropZone').classList.add('over');
  }
  function onDragLeave() {
    document.getElementById('dropZone').classList.remove('over');
  }
  function onDrop(e) {
    e.preventDefault();
    document.getElementById('dropZone').classList.remove('over');
    uploadFiles([...e.dataTransfer.files]);
  }
  function onFileSelect(e) {
    uploadFiles([...e.target.files]);
    e.target.value = '';
  }

  async function uploadFiles(files) {
    const wrap = document.getElementById('progressWrap');
    const bar  = document.getElementById('progressBar');
    wrap.style.display = 'block';

    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      bar.style.width = `${(i / files.length) * 100}%`;
      toast(`Uploading ${f.name}…`, 'info');
      try {
        const fd = new FormData();
        fd.append('file', f);
        const r = await fetch('/api/upload', { method: 'POST', body: fd });
        if (!r.ok) throw new Error((await r.json()).detail || await r.text());
        toast(`${f.name} uploaded`, 'success');
      } catch (e) {
        toast(`${f.name} failed: ${e.message}`, 'error');
      }
    }

    bar.style.width = '100%';
    setTimeout(() => { wrap.style.display = 'none'; bar.style.width = '0%'; }, 900);
    loadFiles();
  }

  // ── File list ──────────────────────────────────
  async function loadFiles() {
    try {
      const d  = await api('GET', '/api/files');
      const list = document.getElementById('filesList');
      const files = d.files || d.documents || [];

      if (!files.length) {
        list.innerHTML = '<div class="files-empty">No files yet</div>';
        return;
      }

      list.innerHTML = files.map(f => {
        const name   = f.displayName || f.name?.split('/').pop() || 'Unknown';
        const fileId = f.name?.split('/').pop() || '';
        const state  = (f.state || 'ACTIVE').toUpperCase();
        const ext    = name.split('.').pop()?.toLowerCase() || '';
        const icon   = { pdf: '📄', txt: '📝', md: '📝', xlsx: '📊', csv: '📊',
                         docx: '📃', pptx: '📊', json: '🗂️', html: '🌐',
                         py: '🐍', js: '⚡', ts: '⚡' }[ext] || '📁';
        const badgeClass = state === 'ACTIVE' ? 'badge-active'
                         : state === 'FAILED' ? 'badge-failed' : 'badge-pending';
        return `
          <div class="file-row" id="fr-${fileId}">
            <span class="file-icon">${icon}</span>
            <span class="file-name" title="${name}">${name}</span>
            <span class="file-badge ${badgeClass}">${state}</span>
            <button class="del-btn" title="Delete" onclick="deleteFile('${fileId}','${name.replace(/'/g,'\\\'')}')">&times;</button>
          </div>`;
      }).join('');
    } catch (e) {
      console.error('loadFiles:', e);
    }
  }

  async function deleteFile(fileId, name) {
    if (!confirm(`Delete "${name}"?`)) return;
    try {
      await api('DELETE', `/api/files/${fileId}`);
      document.getElementById(`fr-${fileId}`)?.remove();
      toast(`${name} deleted`, 'info');
      loadFiles();
    } catch (e) {
      toast('Delete failed: ' + e.message, 'error');
    }
  }

  // ── Chat ───────────────────────────────────────
  function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function addMessage(role, content) {
    document.getElementById('welcome')?.remove();
    const msgs = document.getElementById('messages');
    const row  = document.createElement('div');
    row.className = `msg-row ${role === 'user' ? 'user' : 'bot'}`;
    const avi = role === 'user' ? '👤' : '🤖';
    row.innerHTML = `
      <div class="avatar">${avi}</div>
      <div class="bubble">${fmt(content)}</div>`;
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
    return row;
  }

  function showTyping() {
    document.getElementById('welcome')?.remove();
    const msgs = document.getElementById('messages');
    const row  = document.createElement('div');
    row.id = 'typing';
    row.className = 'msg-row bot';
    row.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function resetChat() {
    document.getElementById('messages').innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-icon">&#129302;</div>
        <h3>RAG Chatbot</h3>
        <p>Create a knowledge store, upload your documents, then ask anything.</p>
      </div>`;
  }

  async function sendMessage() {
    const input = document.getElementById('chatInput');
    const msg   = input.value.trim();
    if (!msg || !storeReady) return;

    input.value = '';
    input.style.height = 'auto';
    document.getElementById('sendBtn').disabled = true;

    addMessage('user', msg);
    showTyping();

    try {
      const d = await api('POST', '/api/chat', { message: msg, history });
      document.getElementById('typing')?.remove();
      addMessage('bot', d.response);

      history.push({ role: 'user',  content: msg });
      history.push({ role: 'model', content: d.response });
      if (history.length > 20) history = history.slice(-20);
    } catch (e) {
      document.getElementById('typing')?.remove();
      addMessage('bot', '⚠️ ' + e.message);
    } finally {
      document.getElementById('sendBtn').disabled = false;
      input.focus();
    }
  }

  // ── Helpers ────────────────────────────────────
  async function api(method, path, body) {
    const opts = { method, headers: {} };
    if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const r = await fetch(path, opts);
    if (!r.ok) {
      let detail = r.statusText;
      try { detail = (await r.json()).detail || detail; } catch {}
      throw new Error(detail);
    }
    return r.json();
  }

  function fmt(text) {
    return text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/```([\s\S]*?)```/g, '<pre>$1</pre>')
      .replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
  }
</script>
