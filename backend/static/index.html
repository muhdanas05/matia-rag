<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Route 66 — AI Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet">
<style>
  html { margin: 0; padding: 0; width: 100%; height: 100%; background: #ffffff; }
  body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif;
    color: #1a1b1e;
    /* iOS Safari: use fill-available so the body stops at the real visible edge */
    min-height: -webkit-fill-available;
  }
  #root {
    width: 100vw;
    /* 100vh includes browser chrome on mobile — 100dvh excludes it */
    height: 100vh;
    height: 100dvh; /* overrides above in modern browsers (Chrome 108+, Safari 15.4+) */
    overflow: hidden;
  }
  /* Safe-area bottom padding for iPhone notch / home indicator */
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }

  /* Liquid Animations & Transitions */
  * { transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
  .liquid-hover { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
  .liquid-hover:hover { transform: scale(1.02) translateY(-2px); box-shadow: 0 12px 24px rgba(0,0,0,0.06); }
  
  .slide-up { animation: slideUpSpring 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes slideUpSpring { 
    0% { opacity: 0; transform: translateY(20px) scale(0.98); } 
    100% { opacity: 1; transform: translateY(0) scale(1); } 
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(0, 102, 204, 0.4); }
    70% { box-shadow: 0 0 0 8px rgba(0, 102, 204, 0); }
    100% { box-shadow: 0 0 0 0 rgba(0, 102, 204, 0); }
  }

  /* Rich Markdown Content Styling (Structured Blocks) */
  .md-content { font-size: 14px; line-height: 1.6; color: #222428; }
  .md-content > *:first-child { margin-top: 0; }
  .md-content > *:last-child { margin-bottom: 0; }
  
  /* Tables */
  .md-content table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 16px 0; border: 1px solid #ececea; border-radius: 12px; overflow: hidden; background: #fff; }
  .md-content th { background: #f7f7f5; padding: 12px 16px; text-align: left; font-weight: 600; font-size: 12.5px; color: #6b6d72; border-bottom: 1px solid #ececea; }
  .md-content td { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; color: #1a1b1e; font-size: 13.5px; }
  .md-content tr:last-child td { border-bottom: none; }
  .md-content tr:hover td { background: #fafaf9; }
  
  /* Quotes / Insight Cards */
  .md-content blockquote { 
    margin: 16px 0; padding: 16px 20px; 
    background: linear-gradient(135deg, #fff5ee, #ffffff);
    border-left: 4px solid #FA7315; border-radius: 0 12px 12px 0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.02); color: #1a1b1e; font-style: italic;
  }
  .md-content blockquote p { margin: 0; }

  /* Headings */
  .md-content h1, .md-content h2, .md-content h3 { font-family: 'Fraunces', Georgia, serif; color: #1a1b1e; margin: 24px 0 12px; }
  .md-content h1 { font-size: 22px; }
  .md-content h2 { font-size: 18px; border-bottom: 1px solid #ececea; padding-bottom: 6px; }
  .md-content h3 { font-size: 15px; }

  /* Roadmap / Timeline (Ordered Lists) */
  .md-content ol { list-style: none; padding-left: 0; margin: 16px 0; position: relative; }
  .md-content ol::before { content: ''; position: absolute; left: 14px; top: 8px; bottom: 8px; width: 2px; background: #ececea; border-radius: 2px; }
  .md-content ol li { position: relative; padding-left: 40px; margin-bottom: 16px; }
  .md-content ol li::before { 
    content: ''; position: absolute; left: 8px; top: 6px; width: 10px; height: 10px; 
    background: #fff; border: 2px solid #FA7315; border-radius: 50%; box-shadow: 0 0 0 4px #fff;
    z-index: 1; transition: all 0.3s;
  }
  .md-content ol li:hover::before { background: #FA7315; transform: scale(1.2); }

  /* Standard Bullets (Unordered Lists) */
  .md-content ul { list-style: none; padding-left: 20px; margin: 16px 0; }
  .md-content ul li { position: relative; margin-bottom: 8px; }
  .md-content ul li::before { content: '→'; position: absolute; left: -20px; color: #FA7315; font-weight: bold; }

  /* Strong & Links */
  .md-content strong { color: #FA7315; font-weight: 600; }
  .md-content a { color: #FA7315; text-decoration: none; font-weight: 500; border-bottom: 1px dashed rgba(250, 115, 21, 0.4); transition: all 0.2s; }
  .md-content a:hover { border-bottom: 1px solid #FA7315; background: #fff3eb; }
  
  /* Code Blocks */
  .md-content pre { background: #1a1b1e; color: #e7e8ea; padding: 16px; border-radius: 12px; overflow-x: auto; font-family: monospace; font-size: 12.5px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.2); }
  .md-content code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 12px; color: #dc4a3a; }
  .md-content pre code { background: transparent; padding: 0; color: inherit; }

  /* Italic & emphasis */
  .md-content em { font-style: italic; color: #5a5c63; }

  /* Strikethrough */
  .md-content del { text-decoration: line-through; color: #a0a2a8; }

  /* Additional heading sizes */
  .md-content h4 { font-size: 13.5px; font-weight: 600; margin: 18px 0 8px; color: #1a1b1e; }
  .md-content h5 { font-size: 12.5px; font-weight: 600; margin: 14px 0 6px; color: #6b6d72; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Horizontal rule */
  .md-content hr { border: none; border-top: 1.5px solid #ffd5b0; margin: 20px 0; border-radius: 2px; }

  /* Paragraphs inside md-content */
  .md-content p { margin: 10px 0; }

  /* Nested list support */
  .md-content ul ul, .md-content ol ol, .md-content ul ol, .md-content ol ul { margin: 6px 0 6px 16px; }

  /* Table overflow on mobile */
  .md-content table { display: block; overflow-x: auto; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  // Configure marked.js for full GFM support (tables, strikethrough, task lists, line breaks)
  if (window.marked) {
    marked.use({ gfm: true, breaks: true });
  }
</script>

<script type="text/babel" src="app.jsx"></script>

<script type="text/babel">
function Root() {
  return (
    <ErrorBoundary>
      <div style={{ width: '100%', height: '100%', display: 'flex' }}>
        <App />
      </div>
    </ErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>

</body>
</html>
